    <!-- Theme Detection (FOUC prevention) -->
    <script>
      (function () {
        try {
          var stored = localStorage.getItem('aidh_theme');
          if (stored === 'dark' || (!stored && window.matchMedia('(prefers-color-scheme: dark)').matches)) {
            document.documentElement.classList.add('dark');
          }
        } catch (e) {}
      })();
    </script>
