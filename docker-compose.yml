services:
  # ─── Backend FastAPI ────────────────────────────────────────────
  api:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nlp_api
    ports:
      - "8000:8000"
    volumes:
      # Mount các thư mục data/model để persist giữa các lần restart
      - ./models:/app/models
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./data:/app/data
      - ./cache:/app/cache
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://agentic:agentic@postgres:5432/agentic_ai
      - REDIS_URL=redis://redis:6379/0
      - MINIO_ENDPOINT=minio:9000
      - CHROMA_HOST=chroma
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - VECTOR_BACKEND=qdrant
      # Tắt GPU nếu không có (chạy trên CPU)
      - CUDA_VISIBLE_DEVICES=-1
      # Cấu hình Hugging Face cache
      - HF_HOME=/app/cache/huggingface
      - TRANSFORMERS_CACHE=/app/cache/huggingface
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:8000/health"]
      interval: 30s
      timeout: 10s
      retries: 5
      start_period: 90s

  # ─── Celery Worker ──────────────────────────────────────────────
  worker:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: nlp_worker
    command: celery -A src.celery_app worker --loglevel=info -c $CELERY_CONCURRENCY
    volumes:
      - ./models:/app/models
      - ./storage:/app/storage
      - ./logs:/app/logs
      - ./data:/app/data
      - ./cache:/app/cache
    environment:
      - PYTHONUNBUFFERED=1
      - DATABASE_URL=postgresql+asyncpg://agentic:agentic@postgres:5432/agentic_ai
      - REDIS_URL=redis://redis:6379/0
      - CELERY_CONCURRENCY=${CELERY_CONCURRENCY:-1}
      - MINIO_ENDPOINT=minio:9000
      - CHROMA_HOST=chroma
      - QDRANT_HOST=qdrant
      - QDRANT_PORT=6333
      - VECTOR_BACKEND=qdrant
      - HF_HOME=/app/cache/huggingface
      - TRANSFORMERS_CACHE=/app/cache/huggingface
      - CUDA_VISIBLE_DEVICES=-1
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    restart: unless-stopped

  # ─── Frontend React (Vite build) ────────────────────────────────
  frontend:
    image: node:20-alpine
    container_name: nlp_frontend
    working_dir: /app
    volumes:
      - ./frontend:/app
    ports:
      - "5173:5173"
    environment:
      - VITE_API_BASE=http://localhost:8000
    command: sh -c "npm install && npm run dev -- --host 0.0.0.0"
    depends_on:
      api:
        condition: service_healthy
    restart: unless-stopped

  postgres:
    image: postgres:16-alpine
    container_name: nlp_postgres
    environment:
      - POSTGRES_DB=agentic_ai
      - POSTGRES_USER=agentic
      - POSTGRES_PASSWORD=agentic
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
      - ./docs/DATABASE_SCHEMA.sql:/docker-entrypoint-initdb.d/001_schema.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentic -d agentic_ai"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  redis:
    image: redis:7-alpine
    container_name: nlp_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  minio:
    image: minio/minio:latest
    container_name: nlp_minio
    command: server /data --console-address ":9001"
    environment:
      - MINIO_ROOT_USER=agentic
      - MINIO_ROOT_PASSWORD=agentic-secret
    ports:
      - "9000:9000"
      - "9001:9001"
    volumes:
      - minio_data:/data
    restart: unless-stopped

  chroma:
    image: chromadb/chroma:latest
    container_name: nlp_chroma
    ports:
      - "8001:8000"
    volumes:
      - chroma_data:/chroma/chroma
    restart: unless-stopped

  # ─── Qdrant Vector Database ─────────────────────────────────────
  qdrant:
    image: qdrant/qdrant:latest
    container_name: nlp_qdrant
    ports:
      - "6333:6333"
      - "6334:6334"
    volumes:
      - qdrant_data:/qdrant/storage
    restart: unless-stopped

volumes:
  models:
  storage:
  postgres_data:
  minio_data:
  chroma_data:
  qdrant_data:
